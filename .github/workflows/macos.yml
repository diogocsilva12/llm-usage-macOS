name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test usage readers and process handling
        run: swift test
      - name: Build and verify the native app
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Limitbar-macOS
          path: dist/Limitbar-macOS.zip
          if-no-files-found: error
